# Publica el portafolio en GitHub Pages (nozz.skin) con cada push a main.
# El repo vive en Forgejo y GitHub es su mirror: el push llega por el mirror y este workflow corre aquí.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# un deploy a la vez; si llega otro push, espera en vez de cortar el que va a medias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    # Forgejo también lee .github/workflows: allá no hay Pages, así que solo corre en GitHub
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # de terceros: fijada a un commit exacto
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # solo este job puede publicar: el que construye no toca Pages
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
